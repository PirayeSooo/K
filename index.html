<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1424">
<title>Öğretmenler Gününüz Kutlu Olsun</title>
<style>
:root{
  --navy:#0a1424; --navy2:#0e1b2e; --grid:#101f35;
  --gold:#c4a062; --gold2:#e0c58a; --white:#ffffff; --muted:#98a5b8;
  --serif:Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background-color:var(--navy);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:40px 40px;
  color:var(--white);font-family:var(--sans);
  display:flex;align-items:center;justify-content:center;
  padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.frame{
  width:100%;max-width:480px;
  border:2px solid var(--gold);border-radius:26px;
  background:rgba(10,20,36,.92);
  padding:30px 22px 28px;text-align:center;
  box-shadow:0 0 0 6px rgba(196,160,98,.08);
}
.school{
  font-family:var(--serif);font-weight:700;
  font-size:clamp(24px,7vw,32px);letter-spacing:.06em;color:var(--gold);
}
.dept{
  margin-top:14px;font-weight:700;font-size:clamp(13px,3.8vw,16px);
  letter-spacing:.14em;color:var(--gold2);
}
.date{margin-top:6px;font-size:12px;letter-spacing:.14em;color:var(--muted)}
.rule{height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:22px 0 10px;border:0}
.scene{width:100%;margin:6px 0 4px}
.scene svg{display:block;width:100%;height:auto;overflow:visible}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
.road{stroke-dasharray:26 20;animation:road 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes road{to{stroke-dashoffset:-46}}
.lead{
  margin-top:18px;font-family:var(--serif);font-weight:700;
  font-size:clamp(26px,8vw,34px);line-height:1.2;color:var(--gold);
}
.lead small{display:block;font-family:var(--sans);font-size:clamp(14px,4vw,17px);font-weight:600;
  letter-spacing:.1em;color:var(--white);margin-bottom:8px}
.sub{margin-top:18px;font-size:clamp(15px,4.2vw,18px);line-height:1.5;color:#dfe5ee}
.foot{margin-top:24px;padding-top:16px;border-top:1px solid rgba(196,160,98,.4);
  font-size:12px;letter-spacing:.2em;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.wheel,.road{animation:none}}
</style>
</head>
<body>
<main class="frame">
  <div class="school">TOPKAPI OKULLARI</div>
  <div class="dept">OTOMOTİV BÖLÜMÜ</div>
  <div class="date">24 KASIM • ÖĞRETMENLER GÜNÜ</div>
  <hr class="rule">

  <div class="scene">
    <svg viewBox="0 0 600 260" role="img" aria-label="Yandan görünen araba">
      <g fill="none" stroke="#c4a062" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <!-- gövde -->
        <path d="M28 192 L28 168 Q28 154 46 150 L122 138 L168 104 Q184 92 210 90 L350 88 Q392 88 418 106 L452 130 L520 140 Q560 148 570 168 L572 192 L486 192 A56 56 0 0 0 374 192 L216 192 A56 56 0 0 0 104 192 Z"/>
        <!-- camlar -->
        <path d="M150 132 L186 104 Q196 98 212 98 L268 98 L268 132 Z" stroke-width="4"/>
        <path d="M282 98 L352 98 Q380 98 398 114 L424 132 L282 132 Z" stroke-width="4"/>
        <!-- kapı, far, kol -->
        <path d="M275 98 L275 186" stroke-width="3" opacity=".6"/>
        <path d="M296 146 L330 146" stroke-width="4"/>
        <path d="M528 152 L556 156" stroke-width="6" stroke="#e0c58a"/>
        <path d="M34 160 L46 160" stroke-width="6" stroke="#e0c58a"/>
        <!-- tekerlekler -->
        <g>
          <circle cx="160" cy="192" r="44" stroke-width="6"/>
          <g class="wheel">
            <circle cx="160" cy="192" r="13" stroke-width="4" stroke="#fff"/>
            <path d="M160 152v26M160 206v26M120 192h26M174 192h26M132 164l18 18M170 202l18 18M188 164l-18 18M150 202l-18 18" stroke-width="4"/>
          </g>
        </g>
        <g>
          <circle cx="430" cy="192" r="44" stroke-width="6"/>
          <g class="wheel">
            <circle cx="430" cy="192" r="13" stroke-width="4" stroke="#fff"/>
            <path d="M430 152v26M430 206v26M390 192h26M444 192h26M402 164l18 18M440 202l18 18M458 164l-18 18M420 202l-18 18" stroke-width="4"/>
          </g>
        </g>
        <!-- yol -->
        <path class="road" d="M10 240 H590" stroke-width="3" opacity=".55"/>
      </g>
    </svg>
  </div>

  <h1 class="lead">Otomotiv Bölümü Öğretmenler Gününüzü Kutlar!</h1>
  <p class="sub">Emeğinizle geleceği harekete geçiriyorsunuz.<br>Öğretmenler Gününüz kutlu olsun.</p>
  <div class="foot">BİLGİ • EMEK • GELECEK</div>
</main>
</body>
</html>
